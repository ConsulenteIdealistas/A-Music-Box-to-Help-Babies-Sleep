    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); out.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); out.push(row); }
  const head = out[0];
  return out.slice(1).filter(r => r.length > 1).map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ""])));
}
function toks(v) { v = (v || "").trim(); return (!v || v === "N/A") ? [] : v.split(";").map(s => s.trim()).filter(Boolean); }
let stratum = "ALL";
function render() {
  const data = rows.filter(r => stratum === "ALL" || r.Stratum === stratum);
  document.getElementById("meta").textContent = `対象 ${data.length} 件（層別: ${stratum}）`;
  const mk = (id, key, cls) => {
    const c = new Map();
    data.forEach(r => toks(r[key]).forEach(t => c.set(t, (c.get(t) || 0) + 1)));
    const items = [...c.entries()].sort((a, b) => b[1] - a[1]);
    const max = items.length ? items[0][1] : 1;
    document.getElementById(id).innerHTML = items.map(([k, v]) =>
      `<div class="bar-row"><div class="bar-lab" title="${k}">${k}</div><div class="bar-track"><div class="bar-fill ${cls}" style="width:${100*v/max}%"></div></div><div class="bar-num">${v}</div></div>`).join("");
    return items.map(([k]) => k);
  };
  const stimKeys = mk("stim", "Stimulus_Canonical", "");
  const outcKeys = mk("outc", "Outcome_Canonical", "o");
  const cell = new Map();
  data.forEach(r => { const ss = toks(r.Stimulus_Canonical), oo = toks(r.Outcome_Canonical);
    ss.forEach(s => oo.forEach(o => { const k = s + "||" + o; cell.set(k, (cell.get(k) || 0) + 1); })); });
  let max = 1; cell.forEach(v => { if (v > max) max = v; });
  let h = "<table><tr><th></th>" + outcKeys.map(o => `<th>${o}</th>`).join("") + "</tr>";
  stimKeys.forEach(s => { h += `<tr><th class="row">${s}</th>` + outcKeys.map(o => {
    const v = cell.get(s + "||" + o) || 0;
    const a = v ? (0.15 + 0.85 * v / max).toFixed(2) : 0;
    return v ? `<td style="background:rgba(111,156,240,${a})">${v}</td>` : `<td class="z">·</td>`; }).join("") + "</tr>"; });
  document.getElementById("matrix").innerHTML = h + "</table>";
}
function setFilter(s) { stratum = s; document.querySelectorAll("#filters button").forEach(b => b.classList.toggle("on", b.dataset.s === s)); render(); }
const F = document.getElementById("filters");
["ALL", "A", "B", "C", "UNDETERMINED"].forEach(s => { const b = document.createElement("button"); b.textContent = s; b.dataset.s = s; b.onclick = () => setFilter(s); F.appendChild(b); });
document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { rows = parseCSV(t); setFilter("ALL"); });
});
rows = parseCSV(SLIM_CSV);
setFilter("ALL");
</script>
