<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<title>A Music Box to Help Babies Sleep</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>A Music Box to Help Babies Sleep</h1>
  <p class="note">開発用スケルトン — 音響パラメータは文献レビュー（Phase 1）で確定します。</p>

  <button id="playBtn" class="play" type="button">▶ 再生</button>

  <section>
    <label for="bpm">心音 BPM <span id="bpmVal">70</span></label>
    <input id="bpm" type="range" min="60" max="90" step="1" value="70">
  </section>

  <section>
    <label for="volMusic">オルゴール</label>
    <input id="volMusic" type="range" min="0" max="100" value="60">
    <label for="volHeart">心音</label>
    <input id="volHeart" type="range" min="0" max="100" value="70">
    <label for="volWaves">さざ波</label>
    <input id="volWaves" type="range" min="0" max="100" value="50">
  </section>

  <section>
    <label for="timer">スリープタイマー（フェードアウト）</label>
    <select id="timer">
      <option value="0">なし</option>
      <option value="15">15分</option>
      <option value="30">30分</option>
    </select>
  </section>

  <button id="lockBtn" class="lock" type="button">画面ロック（未実装）</button>
</main>
<script src="app.js"></script>
</body>
</html>
