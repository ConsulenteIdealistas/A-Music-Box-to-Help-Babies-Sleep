<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<title>A Music Box to Help Babies Sleep</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>A Music Box to Help Babies Sleep</h1>
  <p class="note">音響パラメータは確定設計（統合伝達曲線・心音 55 Hz・試聴で確定したバランス）を反映済み。スライダは全て 80 が設計バランス。</p>

  <button id="playBtn" class="play" type="button">▶ 再生</button>

  <section>
    <label for="song">曲（オルゴール、ループ再生）</label>
    <select id="song">
      <option value="brahms">ブラームスの子守歌</option>
      <option value="yurikago">ゆりかごのうた</option>
      <option value="moldau">モルダウ主題</option>
      <option value="vissi">歌に生き、愛に生き</option>
    </select>
    <p id="songStatus" class="note"></p>
  </section>

  <section>
    <label for="bpm">心音 BPM <span id="bpmVal">70</span></label>
    <input id="bpm" type="range" min="60" max="90" step="1" value="70">
  </section>

  <section>
    <label for="volMusic">オルゴール</label>
    <input id="volMusic" type="range" min="0" max="100" value="80">
    <label for="volHeart">心音</label>
    <input id="volHeart" type="range" min="0" max="100" value="80">
    <label for="volWaves">さざ波</label>
    <input id="volWaves" type="range" min="0" max="100" value="80">
  </section>

  <section>
    <label for="timer">スリープタイマー（フェードアウト）</label>
    <select id="timer">
      <option value="0">なし</option>
      <option value="15">15分</option>
      <option value="30">30分</option>
    </select>
  </section>

  <button id="lockBtn" class="lock" type="button">画面ロック（未実装）</button>
</main>
<script src="app.js"></script>
</body>
</html>
